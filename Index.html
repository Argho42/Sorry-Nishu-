<!DOCTYPE html>
<html>
<head>
  <title>For You</title>
  <style>
    body {
      background-color: #fff0f5;
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      padding: 50px;
    }
    h1 {
      color: #e75480;
    }
    p {
      font-size: 18px;
      color: #444;
    }
    .heart {
      font-size: 40px;
      color: red;
      animation: beat 1s infinite;
    }
    @keyframes beat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }
  </style>
</head>
<body>
  <h1>Hey Nishu</h1>
  <p>I just wanted to say I’m sorry if I upset you.. U mean the World to me babe Forgive me Nishu
  </p>
  <p>You mean the world to me, and I’ll always try to make you smile. Forgive me Nishu</p>
  <div class="heart">♥</div>
  <p>~~ Yours Argho</p>
</body>
</html>
